name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backened
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/

      # Advisory only: the codebase is not yet fully type-clean, so mypy
      # must not gate the build. Do not remove `|| true` without a type-clean pass.
      - name: Run type checking (mypy)
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t geosentinel-backend:test ./backened

      - name: Build frontend image
        run: docker build -t geosentinel-frontend:test ./frontend

      - name: Validate docker-compose config
        run: docker compose config

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Repo-native stdlib checker: validates repository-local markdown links
      # (files + #anchors). External URLs are skipped by policy (flaky hosts
      # must not gate CI). No dependencies to install, no `|| true`.
      - name: Check repository-local markdown links
        run: python .github/scripts/check_markdown_links.py